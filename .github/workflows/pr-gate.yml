name: PR Gate

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql8:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "Admin168"
          MYSQL_DATABASE: dmh
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p'Admin168' --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL and create dmh_test
        run: |
          for i in {1..60}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -p'Admin168' --silent; then
              echo "MySQL is ready"
              break
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -uroot -p'Admin168' -e "CREATE DATABASE IF NOT EXISTS dmh_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Initialize schema
        run: mysql -h 127.0.0.1 -uroot -p'Admin168' dmh < backend/scripts/init.sql

      - name: Run backend unit tests with coverage
        working-directory: backend
        run: |
          go test -p 1 $(go list ./... | grep -v -E 'dmh/test/integration|dmh/test/performance') -coverprofile=coverage.out -covermode=atomic
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Backend coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 76" | bc -l) )); then
            echo "::error::Backend coverage ${COVERAGE}% is below 76% threshold"
            exit 1
          fi
          echo "✓ Backend coverage ${COVERAGE}% meets 76% threshold"

  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend-admin/package-lock.json
            frontend-h5/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend-admin && npm ci
          cd ../frontend-h5 && npm ci

      - name: Run Admin unit tests with coverage
        working-directory: frontend-admin
        run: |
          npm run test:cov 2>&1 | tee /tmp/admin-coverage.log
          PCT=$(grep -E "All files\s*\|" /tmp/admin-coverage.log | tail -1 | awk -F'|' '{gsub(/ /,"",$2); print $2}' | tr -d '%' || true)
          echo "Frontend Admin coverage: ${PCT}%"
          if echo "$PCT" | grep -Eq '^[0-9]+(\.[0-9]+)?$' && [ "${PCT%.*}" -ge 70 ]; then
            echo "✓ Frontend Admin coverage ${PCT}% meets 70% threshold"
          else
            echo "::error::Frontend Admin coverage ${PCT}% is below 70% threshold"
            exit 1
          fi

      - name: Run H5 unit tests with coverage
        working-directory: frontend-h5
        run: |
          npm run test:cov 2>&1 | tee /tmp/h5-coverage.log
          PCT=$(grep -E "All files\s*\|" /tmp/h5-coverage.log | tail -1 | awk -F'|' '{gsub(/ /,"",$2); print $2}' | tr -d '%' || true)
          echo "Frontend H5 coverage: ${PCT}%"
          if echo "$PCT" | grep -Eq '^[0-9]+(\.[0-9]+)?$' && [ "${PCT%.*}" -ge 44 ]; then
            echo "✓ Frontend H5 coverage ${PCT}% meets 44% threshold"
          else
            echo "::error::Frontend H5 coverage ${PCT}% is below 44% threshold"
            exit 1
          fi

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Check Go formatting
        working-directory: backend
        run: |
          FMT_OUTPUT=$(gofmt -d .)
          if [ -n "$FMT_OUTPUT" ]; then
            echo "::error::Go code is not formatted. Run 'gofmt -w .'"
            echo "$FMT_OUTPUT"
            exit 1
          fi
          echo "✓ Go code is properly formatted"

  pr-gate-verdict:
    name: PR Gate Verdict
    if: always()
    runs-on: ubuntu-latest
    needs:
      - backend-unit
      - frontend-unit
      - lint
    steps:
      - name: Summarize results
        run: |
          BACKEND="${{ needs.backend-unit.result }}"
          FRONTEND="${{ needs.frontend-unit.result }}"
          LINT="${{ needs.lint.result }}"

          echo "## PR Gate Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend Unit Tests | $BACKEND |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend Unit Tests | $FRONTEND |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint Check | $LINT |" >> "$GITHUB_STEP_SUMMARY"

          if [ "$BACKEND" = "success" ] && \
             [ "$FRONTEND" = "success" ] && \
             [ "$LINT" = "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **All PR gate checks passed**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "❌ **PR gate checks failed**" >> "$GITHUB_STEP_SUMMARY"
          exit 1
